language: en-US
tone_instructions: "Terse, technical, fragments OK. Skip pleasantries."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  changed_files_summary: true
  sequence_diagrams: false

  path_filters:
    - "!**/*.md"
    - "!cluster-talos/talos/**"
    - "!cluster-talos/tofu/**"
    - "!**/CHANGELOG*"
    - "!**/renovate.json"
    - "!**/.sops.yaml"
    - "!**/*.enc.yaml"

  path_instructions:
    - path: "cluster-talos/kubernetes/**/*.yaml"
      instructions: |
        Flux HelmRelease/Kustomization manifests. Flag: missing resource requests/limits on Deployments/StatefulSets,
        image tags pinned to `latest` or floating, missing PodSecurity context, hostPath without justification.
        Skip style nits on Helm values (vendor-driven).
    - path: "cluster-talos/kubernetes/apps/**/helmrelease.yaml"
      instructions: |
        Check: chart version pinned, values reference existing ConfigMap/Secret, postRenderers don't silently break upgrades.
    - path: "cluster-talos/kubernetes/apps/**/externalsecret.yaml"
      instructions: |
        Verify SecretStore ref matches namespace's ClusterSecretStore. Flag plaintext-looking values in templates.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip-review]"
    drafts: false
    base_branches:
      - "main"
    ignore_usernames:
      - "renovate[bot]"
      - "github-actions[bot]"

  tools:
    yamllint:
      enabled: true
    checkov:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
