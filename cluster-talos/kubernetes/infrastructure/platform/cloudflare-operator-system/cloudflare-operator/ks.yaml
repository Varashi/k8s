---
# cloudflare-operator is a GitRepository OCI-style chart — rendered from
# the upstream repo's ./config/default kustomize dir (vendored via the
# cloudflare-operator GitRepository source in flux-repositories/).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
  path: ./config/default
  prune: true
  sourceRef:
    kind: GitRepository
    name: cloudflare-operator
  wait: true
  timeout: 5m
  # Upstream dropped the config/manager `images:` override in v0.14.0, so the
  # rendered Deployment references the placeholder `controller:latest`.
  # Keep newTag in step with the GitRepository tag (Renovate groups both).
  images:
    - name: controller
      newName: docker.io/adyanth/cloudflare-operator
      newTag: 0.14.0
  patches:
    - target:
        kind: Deployment
        name: cloudflare-operator-controller-manager
      patch: |
        - op: add
          path: /spec/template/spec/tolerations
          value:
            - key: node.cloudprovider.kubernetes.io/uninitialized
              operator: Exists
              effect: NoSchedule
            - key: intel.feature.node.kubernetes.io/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
