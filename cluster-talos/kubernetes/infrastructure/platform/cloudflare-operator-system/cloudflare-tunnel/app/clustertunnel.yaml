apiVersion: networking.cfargotunnel.com/v1alpha2
kind: ClusterTunnel
metadata:
  name: k8s-talos
  namespace: cloudflare-operator-system
spec:
  newTunnel:
    name: k8s-talos
  cloudflare:
    email: ${SECRET_CLOUDFLARE_ACCOUNT_EMAIL}
    domain: ${SECRET_DOMAIN}
    secret: cloudflare-secrets
    accountId: ${SECRET_CLOUDFLARE_ACCOUNT_ID}
  # Pin cloudflared (operator default is the floating :latest, which spegel
  # tag resolution froze at 2026.5.0). Tracked by a Renovate regex manager.
  deployPatch: |
    {"spec":{"template":{"spec":{"containers":[{"name":"cloudflared","image":"docker.io/cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515"}]}}}}
