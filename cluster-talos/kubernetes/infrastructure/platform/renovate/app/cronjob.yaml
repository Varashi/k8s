apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.165.0
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-token
                      key: RENOVATE_TOKEN
                # Only the Gateway API CRD regeneration (renovate.json postUpgradeTasks, #274).
                - name: RENOVATE_ALLOWED_COMMANDS
                  value: '["^curl -fsSL -o cluster-talos/kubernetes/infrastructure/core/gateway-api/app/gateway-api-crds\\.yaml https://github\\.com/kubernetes-sigs/gateway-api/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/standard-install\\.yaml$"]'
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: '["Varashi/k8s", "Varashi/scaleplex", "Varashi/belgarr", "Varashi/gpu-node-vsphere-maintenance-controller"]'
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@${SECRET_DOMAIN}>"
                - name: LOG_LEVEL
                  value: info
