---
# Logging — the operator's top-level CRD. Declares the
# infrastructure (Fluent Bit collector DaemonSet + Fluentd aggregator
# StatefulSet) for one logical logging pipeline. Cluster-wide CRDs
# (ClusterFlow / ClusterOutput) bind to this Logging by name.
#
# Pattern: lightweight per-node collectors → central aggregator(s)
# that run the heavy output plugins. The vmware-loginsight gem
# (fluent-plugin-vmware-loginsight 1.4.2) is bundled in
# ghcr.io/kube-logging/fluentd:v1.17-5.0-full, so no custom image.
apiVersion: logging.banzaicloud.io/v1beta1
kind: Logging
metadata:
  name: vcflogs
  namespace: logging
spec:
  controlNamespace: logging
  # Allow the operator to delete+recreate the Fluent Bit DS / Fluentd
  # STS when an immutable spec field changes (e.g. PVC template's
  # storageClassName, hostPath path, volume size). Without this, the
  # operator refuses with "Object has to be recreated, but refusing
  # to remove without explicitly being told so." For a homelab
  # where the fluentd buffer is a few minutes of log replay, the
  # data-loss-on-recreate cost is acceptable; for production
  # deployments with strict log durability requirements, leave this
  # false and use a planned manual sts delete + PVC migration.
  enableRecreateWorkloadOnImmutableFieldChange: true

  # ---------- Fluent Bit (per-node collector DaemonSet) ----------
  fluentbit:
    # Use a recent stable Fluent Bit image. The Logging Operator
    # generates the config; we tune resources + extra positions DB.
    image:
      repository: fluent/fluent-bit
      tag: 3.1.10
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 50m, memory: 100Mi}
      limits:   {cpu: 500m, memory: 200Mi}
    tolerations:
      - operator: Exists
    # Buffer chunk + memory limit roughly matches what the previous
    # standalone fluent-bit DS used (Mem_Buf_Limit 5MB).
    bufferStorageVolume:
      hostPath:
        path: "/var/lib/fluent-bit-buffer"
    # Skip lines that exceed the input buffer (default) — but our
    # forward-out to Fluentd has no syslog 2048 ceiling, so any
    # long log line that survives Fluent Bit's parser makes it to
    # the aggregator intact. Field names mirror fluent-bit's
    # native [INPUT] tail option casing (`Skip_Long_Lines`,
    # `Mem_Buf_Limit`, `Refresh_Interval`) — the operator passes
    # them through to the rendered config verbatim.
    inputTail:
      Skip_Long_Lines: "On"
      Mem_Buf_Limit: 5MB
      Refresh_Interval: "10"

  # ---------- Fluentd (central aggregator StatefulSet) ----------
  fluentd:
    # Image MUST be the `full` variant — it carries the
    # fluent-plugin-vmware-loginsight gem we need for CFAPI output.
    # `filters` variant only has filter plugins.
    image:
      repository: ghcr.io/kube-logging/fluentd
      tag: v1.17-5.0-full
      pullPolicy: IfNotPresent
    # HA: 2 replicas. Fluent Bit's forward output round-robins, so
    # losing one Fluentd pod doesn't drop logs.
    scaling:
      replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: 1000m, memory: 1Gi}
    # File-buffer on a small PVC per replica — survives pod restart,
    # absorbs vcflogs back-pressure. PVC size chosen to hold ~1h of
    # peak log volume (LogVerbose=1 on prod plex can push 200MB/h).
    # storageClassName omitted on purpose → cluster default (vsan,
    # vSphere CSI). Longhorn was removed earlier; vsan handles
    # ReadWriteOnce + WaitForFirstConsumer just fine.
    bufferStorageVolume:
      pvc:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    # No tolerations on purpose. A wildcard `operator: Exists` here
    # also tolerates `node.kubernetes.io/unschedulable:NoSchedule`
    # (cordon) and any custom maintenance taint, so the aggregator
    # refuses to evict during `kubectl drain` and blocks node
    # maintenance — exactly the problem `terminationGracePeriodSeconds`
    # below tries to mitigate. With no tolerations, the scheduler
    # evicts cleanly on cordon and the STS reschedules on another
    # non-GPU worker.
    #
    # PVC-backed STS: pin to non-GPU workers. GPU workers are scarce
    # and frequently drained for scaleplex / Plex maintenance; a
    # stateful aggregator with a node-affined PVC has no business on
    # one. The label below is set by node-feature-discovery on every
    # GPU worker; using `DoesNotExist` keeps Fluentd off them while
    # still allowing every other worker (current: worker-1, worker-2).
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: intel.feature.node.kubernetes.io/gpu
                  operator: DoesNotExist
    # Don't let the aggregator block node maintenance for hours.
    terminationGracePeriodSeconds: 60
