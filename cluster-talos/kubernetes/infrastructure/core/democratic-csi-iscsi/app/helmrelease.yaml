apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: democratic-csi
spec:
  interval: 1h
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.x
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  values:
    # Pre-provisioned (static) volumes only — vSAN iSCSI exposes no provisioning
    # API, so we use the node-manual driver: no dynamic provisioner, PVs carry
    # the iscsi target/lun in volumeAttributes (see plex-test config PV).
    csiDriver:
      name: org.democratic-csi.node-manual
      # Network iSCSI attaches node-locally (NodeStage logs into the target),
      # so the k8s VolumeAttachment / attach-detach-controller path is pure
      # overhead — and it deadlocks RWO handoffs on a node change: a stale
      # node.status.volumesAttached entry the controller won't release (node-
      # manual ControllerUnpublish doesn't clear it, survives a KCM restart) →
      # permanent "Multi-Attach" on the new node. attachRequired:false skips
      # VolumeAttachments entirely → clean pod rolls AND clean dead-host
      # failover (the static-PV comment's original intent). RWO is still
      # enforced by the scheduler + Recreate strategy (one mount at a time).
      # NOTE: attachRequired is IMMUTABLE — changing it needs the CSIDriver
      # object deleted so helm recreates it.
      attachRequired: false
    storageClasses: []
    volumeSnapshotClasses: []

    driver:
      config:
        driver: node-manual

    # With attachRequired:false there are no VolumeAttachments to manage, and
    # nothing to dynamically provision/resize/snapshot — the controller needs
    # none of the external sidecars.
    controller:
      externalAttacher:
        enabled: false
      externalProvisioner:
        enabled: false
      externalResizer:
        enabled: false
      externalSnapshotter:
        enabled: false

    node:
      # nsenter into the host PID ns to run the iscsi-tools extension's iscsiadm
      # (Talos ships it at /usr/local/sbin/iscsiadm; kubelet's own ns can't reach
      # iscsid, which is why the in-tree iscsi plugin fails on Talos).
      hostPID: true
      driver:
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /usr/local/etc/iscsi
        iscsiDirHostPathType: ""
      # Only GPU workers carry the iscsi-tools extension (baked into their
      # schematic) and the storage NIC — restrict the node plugin to them.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      tolerations:
        - key: intel.feature.node.kubernetes.io/gpu
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
