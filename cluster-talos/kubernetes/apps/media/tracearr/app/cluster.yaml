---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-db
  namespace: tracearr
spec:
  instances: 2
  # PG 17.11 + TimescaleDB 2.29.2 + Toolkit 1.25 + PostGIS 3.6.4 (Debian 13).
  # Was the moving tag 17-3.5 (TS 2.26.2, below Tracearr 2.x's TS 2.28 floor).
  # Collation is C, so the Debian 11 -> 13 glibc change needs no reindex.
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:17.11-3.6.4-system-trixie@sha256:f54e38f1c8dced561dcfb3c067ab0df0ab4c502f3fb5fc527c9bd72108c7a31b

  postgresql:
    parameters:
      timescaledb.max_tuples_decompressed_per_dml_transaction: "0"
      max_locks_per_transaction: "4096"
      timescaledb.telemetry_level: "off"
    shared_preload_libraries:
      - timescaledb

  bootstrap:
    initdb:
      database: tracearr
      owner: tracearr
      secret:
        name: tracearr-db-credentials
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE EXTENSION IF NOT EXISTS timescaledb_toolkit;

  storage:
    size: 20Gi
    storageClass: vsan

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: DoesNotExist
