---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-db
  namespace: tracearr
spec:
  instances: 2
  # PG 18.6 + TimescaleDB 2.31.0 + Toolkit 1.26 + PostGIS 3.6.4 (Debian 13).
  # PG17 -> 18 via CNPG offline in-place major upgrade (pg_upgrade). Before a major
  # bump, ALTER EXTENSION timescaledb/timescaledb_toolkit UPDATE in BOTH tracearr and
  # template1 to a version the new image ships (image bumps don't update extensions).
  # Was the moving tag 17-3.5 (TS 2.26.2, below Tracearr 2.x's TS 2.28 floor).
  # Collation is C, so the Debian 11 -> 13 glibc change needs no reindex.
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:18.6-3.6.4-system-trixie@sha256:e174920699ffec19ab65e0cbbe32e2b6511f1fc0fc18ea470adc68eb0c8ad448

  postgresql:
    parameters:
      timescaledb.max_tuples_decompressed_per_dml_transaction: "0"
      max_locks_per_transaction: "4096"
      timescaledb.telemetry_level: "off"
    shared_preload_libraries:
      - timescaledb

  bootstrap:
    initdb:
      database: tracearr
      owner: tracearr
      secret:
        name: tracearr-db-credentials
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - CREATE EXTENSION IF NOT EXISTS timescaledb_toolkit;

  storage:
    size: 20Gi
    storageClass: vsan

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: DoesNotExist
