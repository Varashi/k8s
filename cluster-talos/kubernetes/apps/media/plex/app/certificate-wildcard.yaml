# Wildcard *.boeye.net cert for the in-pod clientfix SNI TLS front.
# clientfix terminates our own custom-domain TLS (decision rewrite over HTTPS)
# and passes plex.direct TLS straight to loopback PMS (probe rides PMS's real
# cert → no remote-access flapping). cert-manager renews; clientfix hot-reloads.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-wildcard
  namespace: plex
spec:
  secretName: plex-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.${SECRET_DOMAIN}"
