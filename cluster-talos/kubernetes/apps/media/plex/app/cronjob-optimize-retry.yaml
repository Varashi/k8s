apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-optimize-retry-script
  namespace: plex
data:
  retry.py: |
    #!/usr/bin/env python3
    # Retries Plex optimize items stuck in error/disabled state.
    # Episodes: 'disabled' or 'error' (any context).
    # Movies: only 'error/sourceFileUnavailable' (file replaced by arr upgrade —
    #         reprocess re-binds to current Part). transcoderError /
    #         sourceFileMetadataError are deterministic codec/probe failures and
    #         loop forever; skip them.
    #
    # State routing (PMS rejects /reprocess for non-error items):
    #   processingState=error    -> PUT /reprocess  (Plex Web UI: "Retry" on errored)
    #   processingState=disabled -> PUT /enable     (Plex Web UI: "Retry" on "Deleted",
    #                                                meaning the optimized file was
    #                                                cleaned up and needs regenerating)
    #
    # Iterates every optimize job currently in the Background Processing List
    # (playlist 1066). Tautulli creates per-show jobs dynamically, so a fixed
    # JOB_ID is wrong — the BPL is the source of truth for what's active.
    import os, re, sys, urllib.request, urllib.error, json

    PLEX_URL = os.environ.get("PLEX_URL", "http://plex:32400")
    BPL_ID = os.environ.get("PLEX_BPL_ID", "1066")
    PREFS = "/config/Library/Application Support/Plex Media Server/Preferences.xml"
    RETRY_STATES = {"disabled", "error"}

    def is_retry_target(it):
        # Movies: only retry 'error/sourceFileUnavailable' — file replaced by arr
        # upgrade, reprocess re-binds to current Part. transcoderError /
        # sourceFileMetadataError are deterministic and loop forever.
        # Episodes: retry both 'disabled' and 'error' (legacy behavior).
        st = it.get("processingState")
        if it.get("type") == "movie":
            return st == "error" and it.get("processingStateContext") == "sourceFileUnavailable"
        return st in RETRY_STATES

    with open(PREFS) as f:
        m = re.search(r'PlexOnlineToken="([^"]+)"', f.read())
    if not m:
        print("no PlexOnlineToken in Preferences.xml", file=sys.stderr); sys.exit(1)
    token = m.group(1)

    def get_json(path):
        req = urllib.request.Request(
            f"{PLEX_URL}{path}{'&' if '?' in path else '?'}X-Plex-Token={token}",
            headers={"Accept": "application/json"},
        )
        return json.load(urllib.request.urlopen(req, timeout=30))["MediaContainer"]

    def fingerprint(it):
        # Pull source media details: codec/container/resolution/bitrate.
        # Plex API: 'error'/'disabled' items expose no reason field, so we log
        # the source media shape to help spot patterns (e.g. AV1 always failing).
        media = (it.get("Media") or [{}])[0]
        parts = (media.get("Part") or [{}])[0]
        return (
            f"container={media.get('container','?')} "
            f"vcodec={media.get('videoCodec','?')} "
            f"acodec={media.get('audioCodec','?')} "
            f"res={media.get('width','?')}x{media.get('height','?')} "
            f"bitrate={media.get('bitrate','?')} "
            f"file={parts.get('file','?')}"
        )

    jobs = get_json(f"/playlists/{BPL_ID}/items").get("Item", [])
    print(f"bpl_jobs={len(jobs)}")
    grand_ok = grand_fail = grand_total = grand_targets = 0
    for job in jobs:
        job_id = job.get("id")
        job_title = job.get("title", "?")
        try:
            items = get_json(f"/playlists/{BPL_ID}/items/{job_id}/items").get("Metadata", [])
        except urllib.error.HTTPError as e:
            print(f"JOB   {job_id} {job_title} | list http={e.code}")
            continue
        targets = [it for it in items if is_retry_target(it)]
        skipped_movies_disabled = sum(
            1 for it in items
            if it.get("type") == "movie" and it.get("processingState") == "disabled"
        )
        print(f"JOB   {job_id} {job_title} total={len(items)} retry_candidates={len(targets)} skipped_movies_disabled={skipped_movies_disabled}")
        grand_total += len(items); grand_targets += len(targets)
        for it in targets:
            rk = it["ratingKey"]; title = it.get("title", "?")
            state = it.get("processingState")
            ctx = it.get("processingStateContext") or "-"
            show = it.get("grandparentTitle", "")
            season_ep = ""
            if it.get("parentIndex") is not None and it.get("index") is not None:
                season_ep = f" S{it['parentIndex']:02d}E{it['index']:02d}"
            label = f"{show}{season_ep} - {title}".strip(" -")
            print(f"ITEM  {state:8s} {ctx:24s} {rk} {label} | {fingerprint(it)}")
            action = "enable" if state == "disabled" else "reprocess"
            u = f"{PLEX_URL}/playlists/{BPL_ID}/items/{job_id}/{rk}/{action}?X-Plex-Token={token}"
            r = urllib.request.Request(u, method="PUT")
            try:
                urllib.request.urlopen(r, timeout=15)
                print(f"RETRY {state:8s} {ctx:24s} {rk} {label} action={action}")
                grand_ok += 1
            except urllib.error.HTTPError as e:
                print(f"FAIL  {state:8s} {ctx:24s} {rk} {label} action={action} http={e.code}")
                grand_fail += 1
    print(f"done jobs={len(jobs)} total_items={grand_total} targets={grand_targets} ok={grand_ok} fail={grand_fail}")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-optimize-retry
  namespace: plex
  annotations:
    # Mounts plex-config-iscsi (iSCSI, non-snapshottable). Every workload
    # sharing that PVC must agree on generic file backup or K10 fails with
    # "PVC has multiple workloads with conflicting backup annotations".
    k10.kasten.io/forcegenericbackup: "true"
spec:
  # Daytime only: optimize retries trigger Plex transcodes (heavy CPU+GPU).
  # Keep them out of the low-power overnight window.
  schedule: "0 8-19 * * *"
  timeZone: Europe/Brussels
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      annotations:
        # Spawned Jobs mount plex-config-iscsi too; K10 RequiresGVS treats each
        # Job as a workload and needs the signal consistent with the rest.
        k10.kasten.io/forcegenericbackup: "true"
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          tolerations:
            - key: intel.feature.node.kubernetes.io/gpu
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: plex
                      app.kubernetes.io/controller: plex
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: retry
              image: python:3.14-slim
              env:
                - name: PLEX_URL
                  value: http://plex:32400
              command: ["python3", "/scripts/retry.py"]
              volumeMounts:
                - name: config-pms
                  mountPath: /config
                  readOnly: true
                - name: script
                  mountPath: /scripts
          volumes:
            - name: config-pms
              persistentVolumeClaim:
                claimName: plex-config-iscsi
            - name: script
              configMap:
                name: plex-optimize-retry-script
