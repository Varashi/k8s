# Custom "HTML TV App" client profile for old-webOS LG (Tim Noens, user
# noen66 — LG 49UF640V-ZA, webOS 2.1.0, Plex for LG 4.29.9).
#
# OVERWRITES the bundled Resources/Profiles/HTML TV App.xml by Client name
# (custom profiles in <config>/.../Profiles/ fully REPLACE the built-in of the
# same name — not a merge). The built-in has no DirectPlayProfiles, only aac
# TranscodeTargets + a 1080p/8-bit cap, so this replacement loses nothing — it
# just promotes ac3 on HLS and raises the cap.
#
# Why: PMS 1.43.x ignores the v2 webOS shell's `audioCodec=ac3 replace=true`
# augmentation and serves aac instead → the shell loops with error "H4". The
# fix is to make the profile itself force ac3 on the HLS/mpegts target via a
# SEPARATE ac3 VideoProfile entry FIRST (a combined audioCodec="ac3,mp3,aac"
# list does NOT work — PMS still picks aac out of it; verified by replaying
# Tim's decision 2026-06-08). aac kept as a second entry for fallback.
#
# mp3 deliberately NOT listed: old webOS can't play mp3-in-mpegts, so mp3
# audio must transcode anyway (→ ac3, the first target). Newer LG apps use
# the Generic profile and never touch this.
#
# History: added 2026-05-17/18 (ac3-first + 4K/10-bit cap); removed #198
# 2026-06-06 (ac3-only force-transcoded mp3 → 412x320); re-added #209
# 2026-06-07 as ac3,mp3,aac (didn't force ac3 — H4 loop persisted);
# corrected 2026-06-08 to separate ac3-first + aac.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-html-tv-app-profile
  namespace: plex
data:
  HTML_TV_App.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <Client name="HTML TV App">
      <TranscodeTargets>
        <VideoProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="ac3" context="streaming">
          <Setting name="BreakNonKeyframes" value="true" />
        </VideoProfile>
        <VideoProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="aac" context="streaming">
          <Setting name="BreakNonKeyframes" value="true" />
        </VideoProfile>
        <VideoProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <VideoProfile protocol="http" container="mkv" codec="h264" audioCodec="aac" context="streaming" />

        <MusicProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="http" container="mkv" videoCodec="h264" audioCodec="aac" context="streaming" />

        <PhotoProfile container="jpeg" />
      </TranscodeTargets>
      <CodecProfiles>
        <VideoCodec name="*">
          <Limitations>
            <UpperBound name="video.width" value="3840" isRequired="true" />
            <UpperBound name="video.height" value="2160" isRequired="true" />
            <UpperBound name="video.bitDepth" value="10" />
          </Limitations>
        </VideoCodec>
      </CodecProfiles>
    </Client>
