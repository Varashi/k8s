# Custom "HTML TV App" client profile for old-webOS LG (Tim Noens, user
# noen66 — LG 49UF640V-ZA, webOS 2.1.0, Plex for LG 4.29.9).
#
# OVERWRITES the bundled Resources/Profiles/HTML TV App.xml by Client name
# (custom profiles in <config>/.../Profiles/ fully REPLACE the built-in of the
# same name — not a merge). It keeps the bundled aac HLS target and adds a
# 4K/10-bit transcode cap.
#
# AUDIO = aac-FIRST (ac3 second, fallback). The ac3-first theory ("webOS v2
# needs ac3, PMS wrongly serves aac → H4 loop") is NOT supported by playback
# evidence: Tautulli shows 5/5 successful LG sessions on this exact device
# (LG 49UF640V-ZA), ALL transcoded to AAC, incl. 3 mp3->aac at 426x320 — and
# ZERO successful sessions with ac3. The ac3-first profile (added 2026-05-17)
# coincided with the LG going dark; the 2026-06-08 ac3-first re-add (#211)
# force-transcoded Tim's mp3 'Allo 'Allo to ac3 -> 414x320 -> error/H4. So aac
# is the proven-good audio for this client; ac3 kept only as a 2nd fallback.
# (PMS picks the FIRST matching transcode target, so order = aac wins.)
#
# History: added 2026-05-17/18 (ac3-first + 4K/10-bit cap; no LG success
# after); removed #198 2026-06-06; re-added #209 2026-06-07 (ac3,mp3,aac);
# #211 2026-06-08 separate ac3-first (broke Tim, verified via Tautulli);
# 2026-06-08 REORDERED to aac-first per the playback evidence above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-html-tv-app-profile
  namespace: plex
data:
  HTML_TV_App.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <Client name="HTML TV App">
      <TranscodeTargets>
        <VideoProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="aac" context="streaming">
          <Setting name="BreakNonKeyframes" value="true" />
        </VideoProfile>
        <VideoProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="ac3" context="streaming">
          <Setting name="BreakNonKeyframes" value="true" />
        </VideoProfile>
        <VideoProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <VideoProfile protocol="http" container="mkv" codec="h264" audioCodec="aac" context="streaming" />

        <MusicProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="http" container="mkv" videoCodec="h264" audioCodec="aac" context="streaming" />

        <PhotoProfile container="jpeg" />
      </TranscodeTargets>
      <CodecProfiles>
        <VideoCodec name="*">
          <Limitations>
            <UpperBound name="video.width" value="3840" isRequired="true" />
            <UpperBound name="video.height" value="2160" isRequired="true" />
            <UpperBound name="video.bitDepth" value="10" />
          </Limitations>
        </VideoCodec>
      </CodecProfiles>
    </Client>
