# Custom "HTML TV App" client profile for old-webOS LG (Tim Noens).
# RE-IMPLEMENTED 2026-06-07 after the 2026-06-06 removal (#198) reopened the
# webOS "H4" loop (PMS 1.43.x ignores the v2 webOS shell's audioCodec=ac3
# replace=true augmentation → playback loops with error H4).
#
# Fix per the #198 tombstone: promote ac3 (kills the H4 loop) BUT also allow
# mp3,aac in the HLS target so mp3-audio content still DIRECT-STREAMS instead
# of being force-transcoded (that force-transcode + 412x320 sub-burn was why
# the ac3-ONLY version was removed). ac3 first = the codec non-listed sources
# (eac3/dts/…) transcode to; mp3/aac listed = direct-stream fall-through.
# Newer LG apps use the Generic profile and never touch this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-html-tv-app-profile
  namespace: plex
data:
  HTML_TV_App.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <Client name="HTML TV App">
      <!--
       Plex Inc. (original) + Frank: ac3-first H4-loop workaround with
       mp3,aac direct-stream fall-through, 4K/10-bit transcode cap.
       2026-05-17: promote ac3 over aac for HLS+mpegts (PMS 1.43.x H4 loop).
       2026-05-18: raise transcode cap 1080p/8-bit -> 4K/10-bit (sub-burn).
       2026-06-06: removed (#198) — ac3-only force-transcoded mp3.
       2026-06-07: re-added with ac3,mp3,aac (H4 loop returned; keep mp3 DS).
      -->
      <TranscodeTargets>
        <VideoProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="ac3,mp3,aac" context="streaming">
          <Setting name="BreakNonKeyframes" value="true" />
        </VideoProfile>
        <VideoProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <VideoProfile protocol="http" container="mkv" codec="h264" audioCodec="aac" context="streaming" />

        <MusicProfile protocol="hls" container="mpegts" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="dash" container="mp4" videoCodec="h264" audioCodec="aac" context="streaming" />
        <MusicProfile protocol="http" container="mkv" videoCodec="h264" audioCodec="aac" context="streaming" />

        <PhotoProfile container="jpeg" />
      </TranscodeTargets>
      <CodecProfiles>
        <VideoCodec name="*">
          <Limitations>
            <UpperBound name="video.width" value="3840" isRequired="true" />
            <UpperBound name="video.height" value="2160" isRequired="true" />
            <UpperBound name="video.bitDepth" value="10" />
          </Limitations>
        </VideoCodec>
      </CodecProfiles>
    </Client>
