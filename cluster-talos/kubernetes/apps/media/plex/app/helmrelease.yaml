---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      plex:
        # Auto-roll the PMS pod when these subPath-mounted configMaps change.
        # subPath mounts are frozen at pod creation, so a ConfigMap content
        # edit is otherwise a silent no-op (bit us on the HTML TV App profile
        # 2026-06-08 — needed a manual rollout restart). Scoped, NOT
        # `reloader.stakater.com/auto: true`, so cert-manager renewals of the
        # plex-wildcard-tls secret don't needlessly roll PMS — the in-pod
        # clientfix hot-reloads that cert (CLIENTFIX_TLS_RELOAD).
        annotations:
          configmap.reloader.stakater.com/reload: "plex-html-tv-app-profile,plex-log-tail"
        replicas: 1
        # RWO iSCSI /config — RollingUpdate would deadlock (surge pod can't
        # attach the volume held by the old pod). Recreate: old terminates +
        # releases the volume before the new pod starts.
        strategy: Recreate
        pod:
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          tolerations:
            - key: "intel.feature.node.kubernetes.io/gpu"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          securityContext:
            supplementalGroups: [568]
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/plex
              tag: "1.43.3.10896-cb3ebc72d-ls322"
            env:
              TZ: Europe/Brussels
              VERSION: docker
              PUID: "1000"
              PGID: "1000"
              UMASK_SET: "002"
              # scaleplex DOCKER_MOD — lays down scaleplex-shim as
              # /usr/lib/plexmediaserver/Plex Transcoder and runs
              # scaleplex-relay as an s6-rc.d longrun. Transcoding is
              # delegated to the in-namespace orchestrator + worker
              # fleet; the PMS no longer transcodes locally.
              # v1.3.0 (scaleplex v1.9.0): adds Pass-gate L2 — shim reads
              # myPlexSubscription from Preferences.xml → SCALEPLEX_PASS_ACTIVE
              # per session. =sha-62cc0c2.
              # v1.3.1 (scaleplex v1.11.0): shim now queries the local Plex API
              # for Pass state (#126/#127/#133) — drops the deferred Plex.tv
              # roundtrip. Byte-identical on already-active subs; only the
              # discovery path changed. =sha-40fb784.
              # sha-0e6edae (scaleplex v1.14.0): converge prod to the in-pod
              # clientfix model (matches plex-test) — the dockermod now runs
              # clientfix as an s6 longrun with the SNI TLS front. Replaces the
              # standalone clientfix Deployment (removed below). Bundles the
              # ATV-8.45 decision fix + passes plex.direct TLS through to PMS so
              # its reachability probe rides PMS's real cert (no flapping).
              DOCKER_MODS: ghcr.io/varashi/scaleplex_pms_dockermod:sha-0e6edae
              # in-pod clientfix: listen :8080 (pms Service/LB target it),
              # strip mode for ATV-8.45, terminate our *.boeye.net wildcard for
              # the decision rewrite over HTTPS + pass plex.direct TLS through.
              CLIENTFIX_LISTEN_ADDR: ":8080"
              CLIENTFIX_DECISION_MODE: strip
              CLIENTFIX_TLS_CERT: /tls/tls.crt
              CLIENTFIX_TLS_KEY: /tls/tls.key
              # scaleplex-relay listens here; the shim's collectEnv()
              # also reads LOCAL_RELAY_PORT + PMS_SERVICE to derive the
              # per-session SCALEPLEX_PMS_BASE_URL for worker callbacks.
              LOCAL_RELAY_PORT: "32499"
              PMS_SERVICE: plex.plex.svc
              PMS_PORT: "32400"
              SCALEPLEX_ORCHESTRATOR_URL: http://plex-orchestrator.plex.svc:3500
              TRANSCODE_OPERATING_MODE: remote
              # Dump full PMS argv to the PMS log for durable
              # argv-corpus capture (replaces the old argv-tee wrapper).
              SCALEPLEX_DUMP_ARGV: "1"
            resources:
              requests:
                memory: 4Gi
              limits:
                gpu.intel.com/i915: 1

      # scaleplex orchestrator — slim Go HTTP server: DNS-discovers
      # workers via the headless plex-worker Service, forwards the
      # PMS-side shim's task POSTs, picks the least-loaded worker.
      orchestrator:
        containers:
          app:
            image:
              repository: ghcr.io/varashi/scaleplex_orchestrator
              # v1.3.0 (released as scaleplex v1.8.0): adds two new
              # discovery modes alongside the existing DNS — WORKERS_LIST
              # (static comma-list) and PUSH (worker self-registers via
              # POST /register + 5s heartbeat, reaped at 15s). /workers
              # JSON gains a `sources` field; pool re-keyed by URL so
              # all three sources dedup naturally. k8s deployments
              # byte-identical: only the DNS code path runs unless the
              # new envs are set. v1.4.0 (scaleplex v1.9.0): capability-aware
              # routing + LB strategy; collapses to least-loaded on prod's
              # homogeneous Arc fleet (no new envs set).
              # v1.4.1 (scaleplex v1.10.1): /readyz no longer gates on worker
              # presence (#93 push-only-fleet deadlock fix). No-op on prod's
              # DNS-only Arc fleet (always has workers → always Ready); ships for
              # consistency + future push workers. =sha-4ee6996.
              tag: v1.4.1
            env:
              TZ: Europe/Brussels
              LISTEN_ADDR: ":3500"
              WORKERS_DNS: plex-worker.plex.svc.cluster.local
              WORKER_PORT: "3501"
              WORKERS_REFRESH_SECONDS: "5"
              WORKERS_PROBE_SECONDS: "5"
            probes:
              liveness: {enabled: true, custom: true, spec: {httpGet: {path: /healthz, port: 3500}, periodSeconds: 10}}
              readiness: {enabled: true, custom: true, spec: {httpGet: {path: /readyz, port: 3500}, periodSeconds: 2, failureThreshold: 30}}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {memory: 128Mi}
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # No GPU on orchestrator; runs on any node.
          tolerations: []
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "3500"
            prometheus.io/path: /metrics

      worker:
        type: daemonset
        containers:
          app:
            # scaleplex worker. Stock jellyfin-ffmpeg7 + iHD baked into
            # the image. Pre-warms VAAPI on startup; readiness flips
            # only after pre-warm completes so kubelet doesn't kill
            # mid-warm and Service endpoints don't see traffic until
            # the worker is hot.
            image:
              repository: ghcr.io/varashi/scaleplex_worker
              # v1.8.0 — adds `startRegisterLoop()` for PUSH discovery
              # (no-op in k8s since SCALEPLEX_ORCHESTRATOR_URL is unset;
              # DNS code path runs unchanged byte-for-byte from v1.7.2).
              # Worker registers with orchestrator via POST /register +
              # heartbeat only when running on a non-k8s deployment (see
              # deploy/docker/). Validated end-to-end against plex-test
              # PMS on SKW-Docker VM 2026-05-27 (real 4K HDR AV1
              # transcode); plex-test bumped to v1.8.0 the same day
              # 2026-05-27 and ran clean before prod promotion. See
              # project_scaleplex_docker_deployment memory.
              # v1.9.1 (scaleplex v1.9.1): v1.9.0 cross-backend reshape +
              # capability client + Pass-gate L1/L3, plus v1.9.1 patches
              # (#99 cross-backend not Pass-gated, #101 backend-aware
              # pre-warm + 30s timeout). prod PMS is GPU-accelerated (Arc
              # i915, HardwareAcceleratedCodecs=1) so Plex emits VAAPI →
              # worker hw-passthrough; the fleet OFFLOADS the transcode off
              # the PMS Arc onto the worker Arcs. No cross-backend (homo-
              # geneous Arc); gate inert for passthrough; FORCE_HW=1 only
              # re-accels the residual SW-emit cases (L3 probe → relay).
              # v1.10.0 (scaleplex v1.10.0): NVIDIA GPU-resident sub-burn —
              # vf_inlineass CUDA branch (fork patch 0126, #76/#107/#110),
              # full nvenc<->vaapi sub-burn parity. NVENC-only feature;
              # DORMANT on prod's Arc-only fleet — VAAPI path byte-behavior
              # unchanged (proven: qa_matrix Arc 320/320 PASS). Pre-prod
              # gate green both backends 2026-05-29. =sha-<v1.10.0>.
              # v1.11.0 (scaleplex v1.11.0): inlineass `font_path`/
              # `fontconfig_file` scrub HOTFIX (#138) — every force-burn
              # SRT/ASS session on prod was silently hitting libass
              # fontconfig and exiting 145 (uid:1000 vs PMS install paths);
              # rewriter scrubs both keys before ffmpeg sees them, libass
              # falls back to the fork's bundled DejaVu Sans. Cosmetic-only
              # diff vs Plex's Noto Sans Medium. Also includes AMD radeonsi
              # vendor branch (#135, DORMANT on Arc), vendor-aware VAAPI
              # driver detection (#130, no-op for iHD), mesa-va-drivers
              # added to image (#131). =sha-6a446c8.
              # v1.11.1 (scaleplex v1.11.1): hotfix for three latent bugs
              # unmasked by v1.11.0's #138 (#144) — (A) rewriter normalizes
              # PMS `:#0xNN` stream-spec syntax to ordinal form (fixes
              # Plex Versions/Optimized for TV + m2ts high-PID argv that
              # were silently hitting skip:no-decoder bail, ~2.6% of
              # corpus), (B) bail path now rewrites `-manifest_name`
              # loopback URL to relay (was missing, only `-segment_list`
              # was handled → ECONNREFUSED → exit-145 on dash + force-
              # burn), (C) fontconfig cache writable for uid:1000 +
              # Noto Sans bundled with Medium→Regular alias (closes
              # #143 visual-parity gap to stock Plex burns).
              # =sha-ad1119b.
              # v1.13.0 (2026-06-06): HEVC Main10 profile pin on 10-bit HW
              # encodes, all backends (#189) — fixes the ATV-8.45
              # transcoded-HEVC crash (VAAPI was emitting Rext for p010,
              # undecodable by Apple VideoToolbox). plex-test validated
              # (ffprobe Main 10; live Android 4K HEVC). =sha-308cfe2.
              # REVERTED to v1.12.0 2026-06-08: v1.13.0 Main10 pin fires on
              # the upstream `scale_vaapi=format=p010` token even when the
              # tonemap_opencl→nv12 chain converts to 8-bit before the
              # encoder; iHD hevc_vaapi can't satisfy main10 on nv12 →
              # "No usable encoding profile found", ffmpeg exit 218. Breaks
              # every 4K HDR title transcoded with HW HEVC encode + HW
              # sub-burn. PMS gives up after 3 retries, redecides libx264,
              # client hits Shaka s3015 codec mismatch. Reopens ATV-8.45
              # transcoded-HEVC crash until v1.13.1 lands the
              # tonemap-aware tenBitOutput fix. =sha-7667f58.
              tag: v1.13.2
            env:
              TZ: Europe/Brussels
              # Device retarget now in the fork (0116); pin the worker GPU.
              SCALEPLEX_RENDER_DEVICE: /dev/dri/renderD128
              # FORCE_HW=1: always re-accelerate (v1.3.0 behaviour). v1.4.0's
              # honor-Plex-HW/SW is the code default; prod keeps FORCE_HW=1 so
              # the honor paths stay dormant (the HW-dec/SW-enc hybrid 4K-HDR
              # corruption is FORCE_HW=0-only — see KNOWN_ISSUES).
              SCALEPLEX_FORCE_HW: "1"
              # Encoder choice (h264_vaapi vs hevc_vaapi) is driven by
              # PMS argv — Plex picks libx264/libx265 per session, the
              # worker maps 1:1 to the VAAPI variant.
              WORKER_DUMP_ARGV: "1"
            probes:
              liveness: {enabled: true, custom: true, spec: {httpGet: {path: /healthz, port: 3501}, periodSeconds: 10, failureThreshold: 3}}
              readiness: {enabled: true, custom: true, spec: {httpGet: {path: /readyz, port: 3501}, periodSeconds: 2, failureThreshold: 60}}
              startup: {enabled: true, custom: true, spec: {httpGet: {path: /healthz, port: 3501}, periodSeconds: 1, failureThreshold: 30}}
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
                gpu.intel.com/i915: 1
              limits:
                gpu.intel.com/i915: 1
            # CAP_PERFMON lets the worker open i915 PMU events via
            # perf_event_open(2) — the GPU-busy telemetry source on Arc
            # (no sysfs busy file). allowPrivilegeEscalation MUST be
            # true: the worker binary carries cap_perfmon=ep (file
            # capability) so a non-root uid 1000 process gets the cap
            # bits on exec; allowPrivilegeEscalation:false sets
            # no_new_privs which forbids that promotion.
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                add: ["PERFMON"]
        pod:
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          tolerations:
            - key: intel.feature.node.kubernetes.io/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          # uid 1000 / gid 100 (`users`) match the worker Dockerfile's
          # `useradd -u 1000 -g users`. supplementalGroups: 44=video,
          # 568=render — both needed for /dev/dri/renderD128 access.
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
            supplementalGroups: [44, 568]
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "3501"
            prometheus.io/path: /metrics
          terminationGracePeriodSeconds: 30

      # clientfix is no longer a standalone Deployment — it runs in-pod as a
      # dockermod s6 longrun (see DOCKER_MODS + CLIENTFIX_* on the plex
      # container above), matching plex-test. The pms Service / plex-lb target
      # the in-pod clientfix (:8080), and the gateway route flows through it.

    service:
      plex:
        controller: plex
        ports:
          http:
            port: 32400
            # → in-pod clientfix (dockermod longrun) → PMS 127.0.0.1:32400.
            # All pms-Service traffic is decision-proxied; relay (below) hits
            # PMS direct.
            targetPort: 8080
          # scaleplex-relay listens here. Workers POST progress /
          # manifest / segment_list updates to plex:32499; relay
          # forwards to 127.0.0.1:32400 so PMS sees a loopback source.
          relay:
            port: 32499
      orchestrator:
        controller: orchestrator
        ports:
          http:
            port: 3500
      worker:
        # Headless — the orchestrator DNS-resolves this to per-pod IPs.
        # ClusterIP would mask the per-pod addresses behind one VIP and
        # break per-worker /capability polling.
        controller: worker
        clusterIP: None
        ports:
          http:
            port: 3501
      plex-lb:
        type: LoadBalancer
        # WAN/LAN clients hit this LB → in-pod clientfix (:8080) → PMS. The
        # in-pod clientfix carries the SNI TLS front: plex.direct + Plex's
        # reachability probe pass through to PMS's real cert (no flapping);
        # *.boeye.net is terminated for the ATV-8.45 decision rewrite.
        controller: plex
        externalTrafficPolicy: Local
        annotations:
          io.cilium/lb-ipam-ips: "172.16.4.104"
          external-dns.alpha.kubernetes.io/hostname: "plex-svc.${SECRET_DOMAIN}"
        ports:
          http:
            port: 32400
            targetPort: 8080
      plex-public:
        # controller required: app-template can no longer auto-detect
        # it once the HR has multiple controllers (plex + orchestrator
        # + worker). ExternalName Services have no real backing pod;
        # plex is the nominal owner.
        controller: plex
        type: ExternalName
        externalName: skw.wan.${SECRET_DOMAIN}
        annotations:
          external-dns.alpha.kubernetes.io/hostname: plex.${SECRET_DOMAIN},plex-svc.${SECRET_DOMAIN}
          external-dns.alpha.kubernetes.io/public: "true"
        ports:
          http:
            port: 32400

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Plex
          gethomepage.dev/description: Media server
          gethomepage.dev/group: Media
          gethomepage.dev/weight: "10"
          gethomepage.dev/icon: plex.png
          gethomepage.dev/href: https://plex.${SECRET_DOMAIN}
          gethomepage.dev/widget.type: plex
          gethomepage.dev/widget.url: http://plex.plex.svc:32400
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_PLEX}}`}}"
        hostnames:
          - "plex.${SECRET_DOMAIN}"
        parentRefs:
          - name: main
            namespace: cilium
            sectionName: https
        rules:
          # Plex's dynamic handler emits two conflicting Content-Length headers
          # on a Range/206 (full + partial); Envoy rejects per RFC 7230 -> 502,
          # which breaks libmpv (Plex for Windows) external-SRT sub-add over the
          # gateway. Strip Range on /library/streams (subtitle streams are tiny,
          # never need partial) so Plex returns a clean 200. Do NOT broaden to /:
          # /library/parts media serving needs Range for seeking. See Varashi/k8s#164.
          - matches:
              - path:
                  type: PathPrefix
                  value: /library/streams
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove: ["Range"]
            backendRefs:
              - identifier: plex
                port: http
          # All gateway traffic flows through the in-pod clientfix via the plex
          # backend (the pms Service targets clientfix:8080), so no separate
          # decision route is needed — clientfix self-filters for ATV-8.45.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: plex
                port: http

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: plex-config-iscsi
        advancedMounts:
          plex:
            app:
              - path: /config
      # *.boeye.net wildcard for the in-pod clientfix SNI TLS front.
      clientfix-tls:
        type: secret
        name: plex-wildcard-tls
        advancedMounts:
          plex:
            app:
              - path: /tls
                readOnly: true
      transcode:
        # Shared between the PMS (serves segments) and the scaleplex
        # worker (writes segments) — same NFS export, so the worker
        # writes exactly where the PMS reads, no path drift possible.
        type: nfs
        server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
        path: /mnt/SSD/mediapool/plextranscode
        advancedMounts:
          plex:
            app:
              - path: /transcode
          worker:
            app:
              - path: /transcode
      media:
        type: nfs
        server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
        path: /mnt/DATA/mediapool/media
        advancedMounts:
          plex:
            app:
              - path: /media
          worker:
            app:
              - path: /media
      backup:
        type: nfs
        server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
        path: /mnt/DATA/backup/plex
        advancedMounts:
          plex:
            app:
              - path: /backup
      # Custom HTML TV App profile for old-webOS LG (Tim Noens) — ac3-first
      # with mp3,aac direct-stream fall-through to kill the webOS H4 loop
      # without force-transcoding mp3. subPath into the persistent Profiles
      # dir; survives Plex updates. See configmap-html-tv-app-profile.yaml.
      html-tv-app-profile:
        type: configMap
        name: plex-html-tv-app-profile
        advancedMounts:
          plex:
            app:
              - path: "/config/Library/Application Support/Plex Media Server/Profiles/HTML TV App.xml"
                subPath: HTML_TV_App.xml
                readOnly: true
      # s6-overlay longrun that tails PMS's file-based log into the
      # container's stdout, so request/decision detail (incl. anything
      # with LogVerbose=1) flows through fluent-bit → vcflogs alongside
      # the regular container logs. See the configmap for the why.
      plex-log-tail:
        type: configMap
        name: plex-log-tail
        defaultMode: 0o755
        advancedMounts:
          plex:
            app:
              - path: /etc/s6-overlay/s6-rc.d/plex-log-tail/type
                subPath: type
                readOnly: true
              - path: /etc/s6-overlay/s6-rc.d/plex-log-tail/run
                subPath: run
                readOnly: true
              - path: /etc/s6-overlay/s6-rc.d/user/contents.d/plex-log-tail
                subPath: contents-marker
                readOnly: true
