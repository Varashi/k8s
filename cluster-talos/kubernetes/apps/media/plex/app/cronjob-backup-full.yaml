---
# Daily Plex /config snapshot via rsync + --link-dest (rsnapshot pattern).
# Each daily directory under /backup/full/<YYYY-MM-DD>/ is a complete,
# browseable copy of /config; unchanged files are hardlinked to the previous
# day's inode, so 14 daily snapshots cost roughly base + sum(deltas) on disk.
# Excludes regenerable caches/logs and live SQLite DB files (those are
# captured separately by Butler -> /backup/db).
#
# Restore: stop plex, rsync -a /backup/full/<DATE>/ /config/, drop matching
# dated DB dumps from /backup/db into Plug-in Support/Databases/ renamed to
# com.plexapp.plugins.library.db / .blobs.db, start plex.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-backup-full
  namespace: plex
spec:
  schedule: "30 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          tolerations:
            - key: intel.feature.node.kubernetes.io/gpu
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: plex
                      app.kubernetes.io/controller: plex
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: rsync
              image: instrumentisto/rsync-ssh:alpine3.23-r3
              command:
                - /bin/sh
                - -c
                - |
                  # NOTE: intentionally NO `set -e`. rsync of a LIVE /config
                  # routinely returns non-zero for benign reasons (files that
                  # vanish mid-copy, a single unreadable runtime file); aborting
                  # on those skipped touch + retention, so partial snapshots
                  # piled up unpruned. We capture rsync's rc and decide instead.
                  set -u
                  DATE=$$(date +%Y-%m-%d)
                  DEST=/backup/full/$$DATE
                  mkdir -p "$$DEST"

                  # Pick most-recent existing snapshot dir (lex-sorted == date-sorted)
                  LATEST=$$(ls -1d /backup/full/20[0-9][0-9]-[01][0-9]-[0-9][0-9] 2>/dev/null \
                            | grep -v "/$$DATE\$$" | sort | tail -n1 || true)
                  LINK_OPT=""
                  if [ -n "$$LATEST" ]; then
                    LINK_OPT="--link-dest=$$LATEST"
                    echo "linking against: $$LATEST"
                  else
                    echo "no prior snapshot; full copy"
                  fi

                  PMS="Library/Application Support/Plex Media Server"
                  # plexmediaserver.pid is a live runtime file. Since the
                  # 2026-06-13 iSCSI remount its dirent throws readlink_stat
                  # errno 117 (EUCLEAN) on the ext4 /config, which made rsync
                  # exit 23 ("partial transfer due to error") every single run —
                  # the daily failure that stalled retention. Exclude it; a pid
                  # file is never wanted in a backup regardless.
                  rsync -a --delete --stats $$LINK_OPT \
                    --exclude="$$PMS/plexmediaserver.pid" \
                    --exclude="$$PMS/Cache/" \
                    --exclude="$$PMS/Crash Reports/" \
                    --exclude="$$PMS/Diagnostics/" \
                    --exclude="$$PMS/Logs/" \
                    --exclude="$$PMS/Plug-in Support/Caches/" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.db" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.db-shm" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.db-wal" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-shm" \
                    --exclude="$$PMS/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-wal" \
                    /config/ "$$DEST/"
                  RC=$$?

                  # rsync 24 = source files vanished mid-copy (benign on a live
                  # /config): the snapshot is otherwise complete, treat as success.
                  if [ "$$RC" -eq 24 ]; then
                    echo "rsync: vanished-files (24) tolerated"
                    RC=0
                  fi

                  if [ "$$RC" -ne 0 ]; then
                    # Hard failure: drop the partial snapshot so it can't
                    # masquerade as a good one or count toward retention.
                    echo "rsync failed (rc=$$RC); discarding partial snapshot $$DEST"
                    rm -rf "$$DEST"
                  else
                    # rsync -a stamps "$$DEST" with /config's (frozen) source
                    # mtime; reset to now so the dir mtime reflects the run.
                    touch "$$DEST"
                  fi

                  # Retention: keep the 14 most-recent dated snapshots, prune the
                  # rest. Keyed on the YYYY-MM-DD dir NAME (via sort), NOT mtime:
                  # rsync stamps every dir with /config's frozen source mtime, so
                  # an mtime-based `find -mtime +14` saw the whole history as
                  # "expired" and would delete all of it in one sweep.
                  ls -1d /backup/full/20[0-9][0-9]-[01][0-9]-[0-9][0-9] 2>/dev/null \
                    | sort -r | tail -n +15 | while IFS= read -r d; do
                      echo "retention: removing $$(basename "$$d")"
                      rm -rf "$$d"
                    done

                  # Surface real failures to the Job status (alerting) while
                  # still having run retention above.
                  exit "$$RC"
              volumeMounts:
                - name: config-pms
                  mountPath: /config
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: config-pms
              persistentVolumeClaim:
                claimName: plex-config-iscsi
                readOnly: true
            - name: backup
              nfs:
                server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
                path: /mnt/DATA/backup/plex
