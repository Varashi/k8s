---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-secrets
  namespace: tdarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: tdarr-secrets
    creationPolicy: Owner
  data:
    # Node → Server API key. Same BW secret feeds homepage's HOMEPAGE_VAR_TDARR.
    - secretKey: TDARR_API_KEY
      remoteRef:
        key: SECRET_TDARR_API_KEY
