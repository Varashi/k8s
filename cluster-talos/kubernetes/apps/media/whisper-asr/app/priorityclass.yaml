---
# Background batch work that may share nodes with latency-sensitive workloads
# (Plex transcodes on GPU workers). Below the default priority (0) and never
# preempts, so it is the first to go under node pressure.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: background-low
value: -100
preemptionPolicy: Never
globalDefault: false
description: Low-priority background batch work (e.g. whisper-asr on GPU workers).
