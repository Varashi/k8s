# Wildcard *.boeye.net cert for the in-pod clientfix SNI TLS front. The
# clientfix longrun terminates our own custom-domain TLS (decision rewrite
# over HTTPS) and passes plex.direct TLS straight to PMS. cert-manager
# renews it; clientfix hot-reloads the mounted secret (no restart).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-test-wildcard
  namespace: plex-test
spec:
  secretName: plex-test-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.${SECRET_DOMAIN}"
