---
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarr-nl-pg-migrate
  namespace: sonarr-nl
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [568]
      containers:
        - name: migrator
          image: TBD-PER-RUNBOOK
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
          env:
            - { name: SQLITE_PATH, value: /config/sonarr.db }
            - { name: PG_HOST,     value: sonarr-nl-pg-rw.sonarr-nl.svc }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: sonarr_nl }
            - { name: PG_MAIN_DB,  value: sonarr_nl_main }
            - { name: PG_LOG_DB,   value: sonarr_nl_log }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-nl-db-credentials
                  key: password
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp,    mountPath: /tmp }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-nl-config
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
