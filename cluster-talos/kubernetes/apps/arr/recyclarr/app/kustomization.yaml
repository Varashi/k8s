apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: recyclarr
    namespace: recyclarr
    files:
      - recyclarr.yml=./config/recyclarr.yml
      - settings.yml=./config/settings.yml
      - cf-anime-non-english-dual.json=./config/cf-anime-non-english-dual.json
      - cf-anime-non-english-dual-groups.json=./config/cf-anime-non-english-dual-groups.json
      - cf-anime-time-exempt.json=./config/cf-anime-time-exempt.json
      - cf-anime-en-ja-audio.json=./config/cf-anime-en-ja-audio.json
generatorOptions:
  disableNameSuffixHash: true
