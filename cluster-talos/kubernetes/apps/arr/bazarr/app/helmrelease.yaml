---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: bazarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: DoesNotExist
      tolerations:
        - key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [568]
        seccompProfile:
          type: RuntimeDefault
    controllers:
      bazarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/bazarr
              # whisperai.py is overridden by ./whisperai.py (bazarr-patches);
              # re-copy it from the new image and re-apply the patch on upgrade
              tag: 1.6.2
              pullPolicy: IfNotPresent
            env:
              TZ: Europe/Brussels
              POSTGRES_ENABLED: "True"
              POSTGRES_HOST: bazarr-pg-rw.bazarr.svc
              POSTGRES_PORT: "5432"
              POSTGRES_DATABASE: bazarr
              POSTGRES_USERNAME: bazarr
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-db-credentials
                    key: password
            resources:
              requests:
                cpu: 100m
              limits:
                cpu: 1000m
      # Adds the language code to subtitle files imported without one
      # (`<video>.hi.srt` -> `<video>.en.hi.srt`), using Bazarr's own guess,
      # so name-based tools (Lingarr, Plex) see the language too. Runs before
      # Lingarr's nightly translation run.
      subtitle-rename:
        type: cronjob
        cronjob:
          schedule: "30 3 * * *"
          timeZone: Europe/Brussels
          concurrencyPolicy: Forbid
          ttlSecondsAfterFinished: 172800
          backoffLimit: 0
        containers:
          app:
            image:
              repository: python
              tag: 3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              pullPolicy: IfNotPresent
            command: ["python3", "-u", "/scripts/subtitle-lang-rename.py"]
            env:
              TZ: Europe/Brussels
              PYTHONDONTWRITEBYTECODE: "1"
              BAZARR_URL: http://bazarr.bazarr.svc:6767
              BAZARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-api
                    key: BAZARR_API_KEY
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
    service:
      app:
        controller: bazarr
        ports:
          http:
            port: 6767
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            conditions: ["[STATUS] < 500"]
            interval: 60s
            group: arr
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Bazarr
          gethomepage.dev/description: Subtitles
          gethomepage.dev/group: Arr
          gethomepage.dev/weight: "70"
          gethomepage.dev/icon: bazarr.png
          gethomepage.dev/href: https://bazarr.${SECRET_DOMAIN}
          gethomepage.dev/widget.type: bazarr
          gethomepage.dev/widget.url: http://bazarr.bazarr.svc:6767
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_BAZARR}}`}}"
        hostnames:
          - bazarr.${SECRET_DOMAIN}
        parentRefs:
          - name: main
            namespace: cilium
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: bazarr-config
        advancedMounts:
          bazarr:
            app:
              - path: /config
      media:
        type: nfs
        server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
        path: /mnt/DATA/mediapool
        globalMounts:
          - path: /mnt/skw-truenas-data
      backup:
        type: nfs
        server: ${SECRET_NFS_HOST}.${SECRET_DOMAIN}
        path: /mnt/DATA/backup/bazarr
        advancedMounts:
          bazarr:
            app:
              - path: /config/backup
      scripts:
        type: configMap
        name: bazarr-scripts
        defaultMode: 0555
        advancedMounts:
          subtitle-rename:
            app:
              - path: /scripts
      # Local patch: whisperai movie matches also claim "year" (see whisperai.py)
      patches:
        type: configMap
        name: bazarr-patches
        advancedMounts:
          bazarr:
            app:
              - path: /app/bin/custom_libs/subliminal_patch/providers/whisperai.py
                subPath: whisperai.py
                readOnly: true
