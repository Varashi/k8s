apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - cluster.yaml
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: bazarr-scripts
    namespace: bazarr
    files:
      - subtitle-lang-rename.py=./subtitle-lang-rename.py
generatorOptions:
  disableNameSuffixHash: true
