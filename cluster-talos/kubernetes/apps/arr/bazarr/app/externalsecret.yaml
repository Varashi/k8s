---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-db-credentials
  namespace: bazarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: bazarr-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: bazarr
        password: "{{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: SECRET_BAZARR_POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-api
  namespace: bazarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: bazarr-api
    creationPolicy: Owner
  data:
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: SECRET_BAZARR_API_KEY
