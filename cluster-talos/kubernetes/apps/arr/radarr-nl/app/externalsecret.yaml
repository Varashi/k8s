---
# CNPG initdb bootstrap creds + app password env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-nl-db-credentials
  namespace: radarr-nl
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: radarr-nl-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: radarr_nl
        password: "{{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: SECRET_RADARR_NL_POSTGRES_PASSWORD
