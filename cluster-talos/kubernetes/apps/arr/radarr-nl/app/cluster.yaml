---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-nl-pg
  namespace: radarr-nl
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: vsan
  bootstrap:
    initdb:
      database: radarr_nl_main
      owner: radarr_nl
      secret:
        name: radarr-nl-db-credentials
      postInitSQL:
        - CREATE DATABASE radarr_nl_log OWNER radarr_nl;
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: DoesNotExist
