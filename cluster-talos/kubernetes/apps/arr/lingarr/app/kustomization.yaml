apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - cluster.yaml
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: lingarr-scripts
    namespace: lingarr
    files:
      - failure-notify.py=./failure-notify.py
generatorOptions:
  disableNameSuffixHash: true
