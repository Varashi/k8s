---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lingarr-db-credentials
  namespace: lingarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lingarr-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: lingarr
        password: "{{ .dbPassword }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: SECRET_LINGARR_POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lingarr-secret
  namespace: lingarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lingarr-secret
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: SECRET_LINGARR_ANTHROPIC_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: SECRET_SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: SECRET_RADARR_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lingarr-failure-notify
  namespace: lingarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lingarr-failure-notify
    creationPolicy: Owner
    template:
      data:
        HA_WEBHOOK_URL: "http://skw-homeassistant.${SECRET_DOMAIN}:8123/api/webhook/{{ .webhookId }}"
  data:
    - secretKey: webhookId
      remoteRef:
        key: SECRET_HA_WEBHOOK_LINGARR_FAILURES
