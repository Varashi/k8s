---
# One-shot SQLite -> Postgres migrator for prowlarr.
# Note: prowlarr HR runs as root, so /config files are root-owned. Job runs as root to read them.
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-pg-migrate
  namespace: prowlarr
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: migrator
          image: TBD-PER-RUNBOOK
          env:
            - { name: SQLITE_PATH, value: /config/prowlarr.db }
            - { name: PG_HOST,     value: prowlarr-pg-rw.prowlarr.svc }
            - { name: PG_PORT,     value: "5432" }
            - { name: PG_USER,     value: prowlarr }
            - { name: PG_MAIN_DB,  value: prowlarr_main }
            - { name: PG_LOG_DB,   value: prowlarr_log }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-db-credentials
                  key: password
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
