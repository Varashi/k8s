---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarr-pg
  namespace: sonarr
spec:
  instances: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: vsan
  bootstrap:
    initdb:
      database: sonarr_main
      owner: sonarr
      secret:
        name: sonarr-db-credentials
      postInitSQL:
        - CREATE DATABASE sonarr_log OWNER sonarr;
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: DoesNotExist
